<!doctype html>
<html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بيت الإكسسوار</title>
<style>
:root{--purple:#6c5ce7;--pale:#eeecff;--ink:#25233c;--muted:#88899b;--bg:#f7f7fa;--line:#ececf2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Tahoma,sans-serif}header{height:64px;background:#eeecfa;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:3}header .logo{font-size:23px;color:var(--purple);font-weight:900}header button{border:0;background:transparent;font-size:25px;color:var(--purple)}main{max-width:680px;margin:auto;padding:16px 14px 100px}.page{display:none}.page.active{display:block}.hero{background:linear-gradient(115deg,#43339c,#7564ed);color:white;border-radius:20px;padding:20px;margin:10px 0 17px}.hero small{opacity:.85}.hero .big{font-size:32px;font-weight:bold;margin:8px 0 16px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.quick button{background:#e8e5fb;border:0;border-radius:17px;padding:16px 5px;color:var(--purple);font-weight:bold;font-size:15px;min-height:105px}.quick span{display:block;font-size:27px;margin-bottom:8px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:white;border-radius:15px;padding:16px;border:1px solid var(--line)}.stat small{display:block;color:var(--muted);margin-bottom:9px}.stat b{font-size:21px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 12px}.sectionhead h2{font-size:19px;margin:0}label{display:block;color:#77798c;font-size:13px;margin:12px 0 6px}input,select{width:100%;border:1px solid #e0e1eb;border-radius:11px;background:white;padding:13px;font-size:16px;color:var(--ink)}.primary{width:100%;border:0;background:var(--purple);color:white;border-radius:12px;padding:14px;font-size:16px;font-weight:bold;margin-top:15px}.secondary{border:0;border-radius:10px;background:var(--pale);color:var(--purple);padding:10px 12px;font-weight:bold}.entry{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.entry:last-child{border-bottom:0}.entry b{font-size:15px}.sub{font-size:12px;color:var(--muted);margin-top:5px}.price{font-weight:bold;white-space:nowrap}.del{border:0;background:#fff0f0;color:#bd3f4b;padding:8px 10px;border-radius:9px;margin-top:6px}.empty{text-align:center;padding:20px;color:var(--muted)}.bottom{position:fixed;bottom:0;left:0;right:0;background:#e5e2fb;border-top:1px solid #d9d5f7;display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:5}.bottom button{background:none;border:0;color:#9997bd;font-size:12px;min-width:20%;font-weight:bold}.bottom button span{display:block;font-size:22px;margin-bottom:3px}.bottom button.active{color:var(--purple)}.bottom .center{background:var(--purple);color:white;border-radius:50%;width:58px;height:58px;margin-top:-25px;box-shadow:0 0 0 7px #d8d3fb;font-size:26px}.bottom .center span{margin:0}.menu{position:fixed;inset:0;background:#0006;z-index:10;display:none}.menu.open{display:block}.drawer{margin-right:auto;background:white;height:100%;width:min(320px,85%);padding:25px 20px}.drawer h2{color:var(--purple)}.drawer button{display:block;width:100%;text-align:right;padding:16px;border:0;border-bottom:1px solid var(--line);background:white;font-size:16px;color:var(--ink)}.hint{font-size:12px;color:var(--muted);text-align:center;padding:10px}
</style>
<header><button id="menuBtn" aria-label="القائمة">☰</button><div class="logo">🛒</div><button id="crown" aria-label="الحساب">♛</button></header>
<main>
<section class="page active" id="dashboard">
<div class="hero"><small>أهلاً بيك ببيت الإكسسوار</small><div class="big">نظام المبيعات</div><div style="display:flex;justify-content:space-between"><span>مبيعات اليوم</span><b id="heroSales">0 د.ع</b></div><div style="display:flex;justify-content:space-between;margin-top:8px"><span>أرباح اليوم</span><b id="heroProfit">0 د.ع</b></div></div>
<div class="quick"><button onclick="go('neworder')"><span>＋</span>إضافة طلب</button><button onclick="go('newproduct')"><span>▣</span>إضافة منتج</button><button onclick="go('reports')"><span>▥</span>المبيعات</button></div>
<div class="stats"><div class="stat"><small>كل الطلبات</small><b id="totalOrders">0</b></div><div class="stat"><small>المنتجات</small><b id="totalProducts">0</b></div></div>
<div class="card"><div class="sectionhead"><h2>آخر الطلبات</h2><button class="secondary" onclick="go('orders')">عرض الكل</button></div><div id="recent"></div></div>
</section>
<section class="page" id="neworder"><div class="card"><div class="sectionhead"><h2>إضافة طلب</h2><button class="secondary" onclick="go('dashboard')">رجوع</button></div><label>اسم الزبون</label><input id="customer" placeholder="اسم الزبون"><label>المنتج</label><select id="productSelect"><option value="">اختار المنتج</option></select><label>سعر البيع</label><input id="orderPrice" type="number" placeholder="السعر بالدينار"><label>الكمية</label><input id="orderQty" type="number" min="1" value="1"><label>التوصيل (اختياري)</label><input id="orderDelivery" type="number" min="0" value="0"><button class="primary" id="saveOrder">حفظ الطلب</button></div></section>
<section class="page" id="newproduct"><div class="card"><div class="sectionhead"><h2>إضافة منتج</h2><button class="secondary" onclick="go('products')">قائمة المنتجات</button></div><label>اسم المنتج</label><input id="productName" placeholder="مثلاً: سوار رولكس"><label>سعر الشراء</label><input id="productCost" type="number" placeholder="بالدينار"><label>سعر البيع</label><input id="productSell" type="number" placeholder="بالدينار"><button class="primary" id="saveProduct">حفظ المنتج</button></div></section>
<section class="page" id="products"><div class="card"><div class="sectionhead"><h2>المنتجات</h2><button class="secondary" onclick="go('newproduct')">＋ إضافة</button></div><div id="productList"></div></div></section>
<section class="page" id="orders"><div class="card"><div class="sectionhead"><h2>الطلبات</h2><button class="secondary" onclick="go('neworder')">＋ طلب</button></div><div id="orderList"></div></div></section>
<section class="page" id="reports"><div class="stats"><div class="stat"><small>إجمالي المبيعات</small><b id="allSales">0</b></div><div class="stat"><small>إجمالي الأرباح</small><b id="allProfit">0</b></div></div><div class="card"><h2>ملخص المبيعات</h2><div id="reportCounts"></div><button class="primary" id="backup">نسخة احتياطية</button><label>استرجاع نسخة احتياطية</label><input type="file" id="restore" accept=".json"></div></section>
<div class="hint">نسخة أولية — البيانات محفوظة بهذا الجهاز والمتصفح فقط.</div>
</main>
<nav class="bottom"><button data-page="reports"><span>▥</span>التقارير</button><button data-page="products"><span>▦</span>المنتجات</button><button class="center" onclick="go('neworder')"><span>＋</span></button><button data-page="orders"><span>▤</span>الطلبات</button><button data-page="dashboard" class="active"><span>⌂</span>الرئيسية</button></nav>
<div class="menu" id="menu"><div class="drawer"><div class="sectionhead"><h2>بيت الإكسسوار</h2><button class="secondary" id="closeMenu">✕</button></div><button onclick="go('dashboard')">⌂　الرئيسية</button><button onclick="go('neworder')">＋　إضافة طلب</button><button onclick="go('newproduct')">▣　إضافة منتج</button><button onclick="go('products')">▦　المنتجات</button><button onclick="go('orders')">▤　الطلبات</button><button onclick="go('reports')">▥　المبيعات والأرباح</button></div></div>
<script>
const KEY='bayt_wise_like_v1';let db=JSON.parse(localStorage.getItem(KEY)||'{"products":[],"orders":[]}');const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('en-US')+' د.ع',today=()=>new Date().toLocaleDateString('en-GB'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function go(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('.bottom button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===id));$('menu').classList.remove('open');render();window.scrollTo(0,0)}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$('menuBtn').onclick=()=>$('menu').classList.add('open');$('closeMenu').onclick=()=>$('menu').classList.remove('open');$('menu').onclick=e=>{if(e.target===$('menu'))$('menu').classList.remove('open')};$('crown').onclick=()=>alert('إعدادات الحساب نضيفها بالمرحلة الجاية');function sum(arr){return {sales:arr.reduce((s,o)=>s+o.price*o.qty+o.delivery,0),profit:arr.reduce((s,o)=>s+(o.price-o.cost)*o.qty,0)}}function row(o,showDelete=false){return `<div class="entry"><div><b>${esc(o.customer||'زبون')}</b><div class="sub">${esc(o.product)} × ${o.qty} · ${esc(o.date)}<br>ربح ${money((o.price-o.cost)*o.qty)}</div>${showDelete?`<button class="del" onclick="removeOrder('${o.id}')">حذف</button>`:''}</div><div class="price">${money(o.price*o.qty+o.delivery)}</div></div>`}function render(){let t=sum(db.orders.filter(o=>o.date===today())),a=sum(db.orders);$('heroSales').textContent=money(t.sales);$('heroProfit').textContent=money(t.profit);$('totalOrders').textContent=db.orders.length;$('totalProducts').textContent=db.products.length;$('allSales').textContent=money(a.sales);$('allProfit').textContent=money(a.profit);$('productSelect').innerHTML='<option value="">اختار المنتج</option>'+db.products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.sell)}</option>`).join('');$('recent').innerHTML=db.orders.length?[...db.orders].slice(-3).reverse().map(o=>row(o)).join(''):'<div class="empty">بعد ماكو طلبات مسجلة</div>';$('orderList').innerHTML=db.orders.length?[...db.orders].reverse().map(o=>row(o,true)).join(''):'<div class="empty">ماكو طلبات</div>';$('productList').innerHTML=db.products.length?db.products.map(p=>`<div class="entry"><div><b>${esc(p.name)}</b><div class="sub">شراء ${money(p.cost)} · بيع ${money(p.sell)}</div><button class="del" onclick="removeProduct('${p.id}')">حذف</button></div><div class="price">${money(p.sell)}</div></div>`).join(''):'<div class="empty">ضيف أول منتج</div>';$('reportCounts').innerHTML=`<div class="entry"><b>عدد الطلبات</b><b>${db.orders.length}</b></div><div class="entry"><b>عدد المنتجات</b><b>${db.products.length}</b></div>`}function persist(){localStorage.setItem(KEY,JSON.stringify(db));render()}$('productSelect').onchange=()=>{let p=db.products.find(p=>p.id===$('productSelect').value);if(p)$('orderPrice').value=p.sell};$('saveProduct').onclick=()=>{let name=$('productName').value.trim(),cost=$('productCost').value,sell=$('productSell').value;if(!name||cost===''||sell==='')return alert('اكتب اسم المنتج وسعر الشراء والبيع');if(+cost<0||+sell<0)return alert('السعر غير صحيح');db.products.push({id:crypto.randomUUID(),name,cost:+cost,sell:+sell});['productName','productCost','productSell'].forEach(id=>$(id).value='');persist();alert('تم حفظ المنتج');go('products')};$('saveOrder').onclick=()=>{let p=db.products.find(p=>p.id===$('productSelect').value),qty=+$('orderQty').value,price=+$('orderPrice').value,delivery=+$('orderDelivery').value;if(!p)return alert('اختار المنتج');if($('orderPrice').value===''||qty<1||price<0||delivery<0)return alert('تأكد من السعر والكمية');db.orders.push({id:crypto.randomUUID(),customer:$('customer').value.trim(),product:p.name,qty,price,cost:p.cost,delivery,date:today()});['customer','orderPrice'].forEach(id=>$(id).value='');$('orderQty').value=1;$('orderDelivery').value=0;$('productSelect').value='';persist();alert('تم حفظ الطلب');go('dashboard')};window.removeOrder=id=>{if(confirm('تحذف الطلب؟')){db.orders=db.orders.filter(o=>o.id!==id);persist()}};window.removeProduct=id=>{let p=db.products.find(p=>p.id===id);if(db.orders.some(o=>o.product===p?.name))return alert('المنتج مرتبط بطلب مسجل');if(confirm('تحذف المنتج؟')){db.products=db.products.filter(p=>p.id!==id);persist()}};$('backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='bayt-sales-backup.json';a.click();URL.revokeObjectURL(a.href)};$('restore').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.products)||!Array.isArray(x.orders))throw 0;if(confirm('استبدال البيانات الحالية بالنسخة؟')){db=x;persist();alert('تم الاسترجاع')}}catch{alert('ملف النسخة غير صالح')}e.target.value=''};render();
</script></html>
